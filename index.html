<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>trade.exe v10</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #000000; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
    }
    #root { min-height: 100vh; }
    .no-scrollbar::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime"
    }
  }
  </script>

  <!-- Babel переводит настоящий JSX (<div>...</div>) в обычный JS прямо в
       браузере — сборка (Vite/webpack) не нужна, как и раньше с app.js. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- ВРЕМЕННЫЙ ПЕРЕХВАТЧИК ОШИБОК.
       Показывает текст ошибки прямо на экране вместо чёрного экрана.
       После того как баг найден и исправлен, этот блок можно удалить. -->
  <script>
  (function () {
    function show(title, text) {
      var box = document.getElementById("errbox");
      if (!box) {
        box = document.createElement("pre");
        box.id = "errbox";
        box.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;" +
          "margin:0;padding:16px;background:#111;color:#fff;font-size:11px;" +
          "white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;" +
          "overflow:auto;-webkit-user-select:text;user-select:text;";
        document.body.appendChild(box);
      }
      box.textContent += title + "\n" + text + "\n\n----------------\n\n";
    }
    window.addEventListener("error", function (e) {
      var err = e.error;
      show("ОШИБКА: " + e.message,
        "файл: " + e.filename + "\nстрока: " + e.lineno + ":" + e.colno +
        "\n\n" + (err && err.stack ? err.stack : "(без стека)"));
    });
    window.addEventListener("unhandledrejection", function (e) {
      var r = e.reason;
      show("ОШИБКА (promise): " + (r && r.message ? r.message : r),
        (r && r.stack) ? r.stack : "(без стека)");
    });
    var origError = console.error;
    console.error = function () {
      try {
        show("console.error:", Array.prototype.map.call(arguments, function (a) {
          if (a instanceof Error) return a.stack || a.message;
          if (typeof a === "object") { try { return JSON.stringify(a); } catch (_) { return String(a); } }
          return String(a);
        }).join(" "));
      } catch (_) {}
      return origError.apply(console, arguments);
    };
  })();
  </script>
  <!-- ?v=10 — при каждой новой версии app.js увеличивайте это число. -->
  <script type="text/babel" data-presets="react" data-type="module" src="./app.js?v=10"></script>
</body>
</html>

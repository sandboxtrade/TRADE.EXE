<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Market Sandbox</title>

  <!-- Приложение написано на классах Tailwind (flex, rounded-lg, text-[13px] и т.д.).
       Обычный статический сайт не понимает их сам по себе — этот скрипт подключает
       Tailwind прямо в браузере и на лету превращает классы в реальные стили.
       Без этой строки страница откроется, но будет выглядеть как голый HTML без дизайна. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #000000; overscroll-behavior: none; }
    #root { min-height: 100vh; }
  </style>

  <!-- Карта импортов: говорит браузеру, откуда брать React и Firebase, когда
       app.js пишет "import ... from 'react'". Ничего скачивать самим не нужно —
       браузер сам подгрузит эти библиотеки с esm.sh / gstatic по ссылке при
       открытии страницы. Если понадобится Firebase — трогать эту секцию не нужно,
       достаточно вписать свои значения ВНУТРИ app.js (см. комментарий в начале файла). -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- ?v=1 — «пароль-пустышка» в конце ссылки. При каждой новой версии app.js
       увеличивайте это число (v=2, v=3, ...) — иначе браузер (особенно на
       телефоне) может показывать старую сохранённую версию файла даже после
       того, как вы залили новую на GitHub. -->
  <script type="module" src="./app.js?v=4"></script>
</body>
</html>
